<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password protected</title>
  <meta name="description" content="This file is password protected.">
  <meta name="theme-color" content="#f3ecdf">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect x='7' y='15' width='20' height='14' rx='3' fill='none' stroke='%23241c16' stroke-width='2'/%3E%3Cpath d='M11.5 15v-3.2a5.5 5.5 0 0 1 11 0V15' fill='none' stroke='%23241c16' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --paper: #f3ecdf;
      --sheet: #fffaf3;
      --ink: #241c16;
      --muted: #6f6256;
      --line: #e3d4c2;
      --rose: #8d3b32;
      --shadow: 0 24px 60px rgba(70, 46, 22, 0.08);
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        radial-gradient(900px 420px at 50% -10%, #fff 0%, transparent 60%),
        var(--paper);
      color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    }

    main {
      width: min(440px, 100%);
      background: var(--sheet);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 36px 30px 30px;
    }

    .lock {
      width: 42px;
      height: 42px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      color: var(--ink);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-weight: 560;
      font-size: clamp(1.7rem, 5vw, 2.05rem);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .ask {
      margin: 14px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.45;
    }

    form { margin-top: 26px; }

    label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 14px;
      padding: 15px 16px;
      font: inherit;
      font-size: 1.15rem;
      text-align: center;
      outline: none;
    }

    input:focus {
      border-color: #c4a98a;
      box-shadow: 0 0 0 4px rgba(196, 169, 138, 0.25);
    }

    button {
      width: 100%;
      margin-top: 12px;
      border: 0;
      border-radius: 14px;
      padding: 14px 16px;
      background: var(--ink);
      color: #f7f1e8;
      font: inherit;
      font-size: 1.05rem;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.72;
    }

    button:focus-visible {
      outline: 3px solid #c4a98a;
      outline-offset: 3px;
    }

    .note {
      min-height: 3.2rem;
      margin: 16px 0 0;
      text-align: center;
      color: var(--rose);
      font-size: 1.02rem;
      line-height: 1.4;
    }

    .note p { margin: 0; }
    .note p + p { margin-top: 4px; }

    .reveal {
      display: none;
      margin: 8px 0 6px;
      text-align: center;
      font-size: clamp(1.55rem, 4.6vw, 1.95rem);
      line-height: 1.35;
      letter-spacing: -0.02em;
    }

    .reveal.show { display: block; }

    .shake { animation: shake 0.42s ease; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .shake { animation: none; }
    }
  </style>
</head>
<body>
  <main id="sheet">
    <div class="lock" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <rect x="7" y="15" width="20" height="14" rx="3" stroke="currentColor" stroke-width="1.7"/>
        <path d="M11.5 15v-3.2a5.5 5.5 0 0 1 11 0V15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <circle cx="17" cy="22" r="1.3" fill="currentColor"/>
      </svg>
    </div>
    <h1 id="title">This file is password protected.</h1>
    <p class="ask" id="ask">The password is the distance between you and your bestie, in kilometers.</p>
    <form id="gate">
      <label for="distance">Distance in kilometers</label>
      <input id="distance" name="distance" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="go" placeholder="kilometers" required>
      <button id="open" type="submit">Open</button>
      <div class="note" id="note" aria-live="polite"></div>
    </form>
    <p class="reveal" id="reveal"></p>
  </main>
  <script>
    const SALT = "2qab4uUnF4UxqFhnhf79fg==";
    const IV = "GrhOGJNrtF3Zi7p+";
    const SECRET = "AM+9i3VnsMwVjTS9JgLCH15XqCBaE97oXLSOt4yFV7WzRmjz4UUWqIvpqSGSP36eWROMNjApzZ+nKWSCydpa8xRPBLqzXUfQx5nFGgUurs+vwaUAvrVl/iBMD3PaVpjqOJbu";
    const ITERATIONS = 150000;

    const form = document.getElementById("gate");
    const input = document.getElementById("distance");
    const button = document.getElementById("open");
    const note = document.getElementById("note");
    const reveal = document.getElementById("reveal");
    const title = document.getElementById("title");
    const ask = document.getElementById("ask");
    const lock = document.querySelector(".lock");

    function bytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    function normalize(raw) {
      let s = String(raw).trim().toLowerCase().replace(/\s+/g, " ");
      s = s.replace(/kilometers?|kilometres?/g, " ").replace(/\bkm\b/g, " ").replace(/\s+/g, " ").trim();
      if (s === "zero") return "0";
      if (s === "") return "";
      const n = Number(s.replace(",", "."));
      if (Number.isFinite(n) && n === 0) return "0";
      return s;
    }

    function wrong() {
      note.innerHTML = "<p>Wrong password.</p><p>Clue: where is your best friend now?</p>";
      input.classList.remove("shake");
      void input.offsetWidth;
      input.classList.add("shake");
      input.focus();
      input.select();
    }

    async function openWith(password) {
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: bytes(SALT), iterations: ITERATIONS, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: bytes(IV) },
        key,
        bytes(SECRET)
      );
      return new TextDecoder().decode(plain);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      note.textContent = "";
      const password = normalize(input.value);
      if (!password) {
        wrong();
        return;
      }
      button.disabled = true;
      button.textContent = "One second…";
      await new Promise((resolve) => setTimeout(resolve, 40));
      try {
        const message = await openWith(password);
        title.hidden = true;
        ask.hidden = true;
        lock.hidden = true;
        form.hidden = true;
        reveal.textContent = message;
        reveal.classList.add("show");
        document.title = "Already with you";
      } catch (err) {
        wrong();
        button.disabled = false;
        button.textContent = "Open";
      }
    });
  </script>
</body>
</html>
